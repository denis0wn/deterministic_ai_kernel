name: integrity

on:
  push:
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run integrity preflight
        run: cargo run -- integrity-json > integrity-report.json

      - name: Validate integrity JSON
        run: |
          python3 - <<'PY'
          import json
          with open("integrity-report.json") as f:
              data = json.load(f)
          assert data["ok"] is True
          assert data["schema_version"] == "cli-json-v1"
          assert data["command"] == "integrity-json"
          report = data["report"]
          assert report["ok"] is True
          assert report["snapshot_version"] == 1
          assert report["schema_version"] == 1
          assert report["created_at_present"] is True
          assert report["state_hash_present"] is True
          assert report["state_present"] is True
          PY
