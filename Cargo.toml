[package]
name = "deterministic_ai_kernel"
version = "0.1.0"
edition = "2021"
default-run = "deterministic_ai_kernel"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
dotenvy = "0.15"
jsonschema = { version = "0.46.8", default-features = false, features = ["resolve-file"] }
uuid  = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[[bin]]
name = "deterministic_ai_kernel"
path = "src/main.rs"

[lib]
name = "deterministic_ai_kernel"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.6"
serial_test = "3.5.0"

tempfile = "3"
