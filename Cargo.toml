[package]
name = "deterministic_ai_kernel"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"

[[bin]]
name = "deterministic_ai_kernel"
path = "src/main.rs"

[lib]
name = "deterministic_ai_kernel"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.6"
