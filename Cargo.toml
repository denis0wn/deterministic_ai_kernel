[package]
name = "deterministic_ai_kernel"
version = "0.1.0"
edition = "2021"
default-run = "deterministic_ai_kernel"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
dotenvy = "0.15"
jsonschema = { version = "0.46.8", default-features = false, features = ["resolve-file"] }
uuid  = { version = "1", features = ["v4", "serde"] }
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.28"
crossterm = "0.28"
regex = "1"

[[bin]]
name = "deterministic_ai_kernel"
path = "src/main.rs"

[[bin]]
name = "replay_os"
path = "src/bin/replay_os.rs"

[[bin]]
name = "kernel_tui"
path = "src/bin/kernel_tui.rs"

[lib]
name = "deterministic_ai_kernel"
path = "src/lib.rs"

[dev-dependencies]
proptest = "1.6"
serial_test = "3.5.0"

tempfile = "3"
